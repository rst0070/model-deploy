name: yolo

on:
  pull_request:
    paths:
      - "apps/yolo/**"
      - ".github/workflows/yolo.yml"
  push:
    tags:
      - "yolo-v*"

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      UV_PYTHON: "3.11"
    steps:
      - uses: actions/checkout@v7
      # setup-uv publishes no floating major tag past v7; the SHA is v10.3.0.
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: apps/yolo/uv.lock
      # The real-adapter tests download the weights into apps/yolo/ on first run.
      - uses: actions/cache@v6
        with:
          path: apps/yolo/yolo26x.pt
          key: yolo26x-weights-v8.4.0
      - run: make -C apps/yolo lint
      - run: make -C apps/yolo test

  publish:
    if: startsWith(github.ref, 'refs/tags/yolo-v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      # The image is about 8 GB, nearly all CUDA wheels; drop unused toolchains so build and export fit.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af
      - uses: actions/checkout@v7
      - id: version
        run: echo "version=${GITHUB_REF_NAME#yolo-v}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      # Only the version tag, never `latest`: the host pins an immutable tag in config.yaml.
      # provenance: false keeps the push a plain image manifest for `docker manifest inspect`.
      - uses: docker/build-push-action@v7
        with:
          context: apps/yolo
          push: true
          provenance: false
          tags: ghcr.io/rst0070/model-deploy-yolo:${{ steps.version.outputs.version }}
          labels: org.opencontainers.image.source=https://github.com/rst0070/model-deploy

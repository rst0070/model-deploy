services:
  vllm-gemma3-4b-it:
    image: vllm/vllm-openai:v0.9.1
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface
      - ./tool_chat_template_gemma3_pythonic.jinja:/root/tool_chat_template_gemma3_pythonic.jinja
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HUGGING_FACE_HUB_TOKEN}
    ports:
      - "8000:8000"
    ipc: host
    command: |
      --model google/gemma-3-4b-it --enable-auto-tool-choice --tool-call-parser pythonic --chat-template /root/tool_chat_template_gemma3_pythonic.jinja
  
  vllm-qwen3_5-0_8b:
    image: vllm/vllm-openai:v0.9.1
    runtime: nvidia
    ports:
      - "8000:8000"
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HUGGING_FACE_HUB_TOKEN:-}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    ipc: host
    command:
      - --model
      - Qwen/Qwen3.5-0.8B
      - --max-model-len
      - "4096"
      # - --gpu-memory-utilization
      # - "0.40"
      - --dtype
      - half
      - --limit-mm-per-prompt
      - image=0
      - --enable-prefix-caching
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
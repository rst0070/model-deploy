services:
  ollama:
    image: ollama/ollama:0.30.11
    container_name: ollama
    restart: unless-stopped
    ports:
      - "8000:11434"
    ipc: host
    volumes:
      - ~/.ollama:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

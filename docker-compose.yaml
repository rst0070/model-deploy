# Compose owns only llama-swap. Engines are not services here: llama-swap
# starts and stops them with `docker run` / `docker stop` from its config.
services:
  llama-swap:
    build: .
    image: model-deploy/llama-swap:265
    container_name: llama-swap
    init: true
    restart: unless-stopped
    ports:
      # Host port from deploy.sops.env; the container side stays 8080.
      - "${LLAMA_SWAP_PORT:?set LLAMA_SWAP_PORT in deploy.sops.env (run through make)}:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./llama-swap/config.yaml:/etc/llama-swap/config.yaml:ro
      # Not read here: the entrypoint asks the daemon for this mount's host
      # path and passes it to engines as ENGINES_DIR.
      - ./engines:/engines:ro
    environment:
      LLAMA_SWAP_API_KEY: ${LLAMA_SWAP_API_KEY:?set LLAMA_SWAP_API_KEY in deploy.sops.env (run through make)}
      HOST_CACHE_DIR: ${HOST_CACHE_DIR:?set HOST_CACHE_DIR in deploy.sops.env (run through make)}
      HUGGING_FACE_HUB_TOKEN: ${HUGGING_FACE_HUB_TOKEN:-}
      # The same token under the name llama-server reads.
      HF_TOKEN: ${HUGGING_FACE_HUB_TOKEN:-}
    # llama-swap gives itself 30s to stop its engines on SIGTERM.
    stop_grace_period: 40s

networks:
  default:
    # Fixed name so engine `docker run --network model-deploy` can join it.
    name: model-deploy

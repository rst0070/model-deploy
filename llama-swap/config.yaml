# yaml-language-server: $schema=https://raw.githubusercontent.com/mostlygeek/llama-swap/refs/heads/main/config-schema.json

# A first load downloads weights, so allow well past the 120s default.
healthCheckTimeout: 900

apiKeys:
  - "${env.LLAMA_SWAP_API_KEY}"

macros:
  # Shared `docker run` for every vLLM engine. The engine is a sibling container
  # on the host daemon: bind-mount sources are host paths, and it publishes no
  # host port, llama-swap reaches it by container name on the compose network.
  # ENGINES_DIR is the host path of this repo's engines/, set by the entrypoint.
  # `-e HUGGING_FACE_HUB_TOKEN` copies the value from llama-swap's environment,
  # so the token never appears in this file or in the logged command line.
  "vllm-run": >
    docker run --name ${MODEL_ID} --rm --init
    --label model-deploy.engine=${MODEL_ID}
    --network model-deploy
    --gpus all --ipc host
    -e HUGGING_FACE_HUB_TOKEN
    -v ${env.HOST_CACHE_DIR}/huggingface:/root/.cache/huggingface
    -v ${env.HOST_CACHE_DIR}/vllm:/root/.cache/vllm
    -v ${env.ENGINES_DIR}/vllm:/engines/vllm:ro
    vllm/vllm-openai:v0.31.0
    --host 0.0.0.0 --port 8000
    --gpu-memory-utilization 0.85

  # Shared `docker run` for every llama.cpp engine, on the same terms as
  # vllm-run. `-hf` downloads into the Hugging Face hub layout under
  # $HOME/.cache/huggingface/hub (the image runs as root), so the vLLM HF
  # cache mount persists it too. llama-server reads its token from HF_TOKEN,
  # which compose sets from HUGGING_FACE_HUB_TOKEN. Host and port are explicit:
  # outside the image's LLAMA_ARG_* env the binary defaults to 127.0.0.1:9931.
  # -ngl 99 puts every layer on the GPU.
  "llamacpp-run": >
    docker run --name ${MODEL_ID} --rm --init
    --label model-deploy.engine=${MODEL_ID}
    --network model-deploy
    --gpus all
    -e HF_TOKEN
    -v ${env.HOST_CACHE_DIR}/huggingface:/root/.cache/huggingface
    ghcr.io/ggml-org/llama.cpp:server-cuda-b11749
    --host 0.0.0.0 --port 8080
    -ngl 99

# Every model unloads after 600s with no requests, giving the GPU back.
models:
  "qwen3.5-0.8b":
    proxy: http://${MODEL_ID}:8000
    ttl: 600
    cmd: |
      ${vllm-run}
      --model Qwen/Qwen3.5-0.8B
      --max-model-len 4096
      --dtype half
      --limit-mm-per-prompt '{"image": 0}'
      --enable-prefix-caching
    cmdStop: docker stop ${MODEL_ID}

  "gemma-3-4b-it":
    proxy: http://${MODEL_ID}:8000
    ttl: 600
    cmd: |
      ${vllm-run}
      --model google/gemma-3-4b-it
      --enable-auto-tool-choice
      --tool-call-parser pythonic
      --chat-template /engines/vllm/tool_chat_template_gemma3_pythonic.jinja
    cmdStop: docker stop ${MODEL_ID}

  # The same model as qwen3.5-0.8b, through llama.cpp. Q8_0 is the closest
  # quant to vLLM's fp16 for a model this small. Text only, like the vLLM
  # entry: the repo ships no mmproj, and --no-mmproj keeps it that way.
  # --jinja uses the chat template embedded in the GGUF.
  "qwen3.5-0.8b-gguf":
    proxy: http://${MODEL_ID}:8080
    ttl: 600
    cmd: |
      ${llamacpp-run}
      -hf ggml-org/Qwen3.5-0.8B-GGUF:Q8_0
      -c 4096
      --no-mmproj
      --jinja
    cmdStop: docker stop ${MODEL_ID}

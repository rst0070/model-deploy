# yaml-language-server: $schema=https://raw.githubusercontent.com/mostlygeek/llama-swap/refs/heads/main/config-schema.json

# A first load downloads weights, so allow well past the 120s default.
healthCheckTimeout: 900

apiKeys:
  - "${env.LLAMA_SWAP_API_KEY}"

macros:
  # vLLM's share of VRAM. vLLM claims this fraction of the whole card at start
  # whatever the model's size, so a model that must leave room for a neighbour
  # overrides it in its own `macros:`; gemma-3-4b-it keeps this default.
  # Declared before vllm-run: macros expand in reverse declaration order, so
  # one that another macro references has to come first.
  "vllm-gpu": "0.85"

  # Shared `docker run` for every vLLM engine. The engine is a sibling container
  # on the host daemon: bind-mount sources are host paths, and it publishes no
  # host port, llama-swap reaches it by container name on the compose network.
  # ENGINES_DIR is the host path of this repo's engines/, set by the entrypoint.
  # `-e HUGGING_FACE_HUB_TOKEN` copies the value from llama-swap's environment,
  # so the token never appears in this file or in the logged command line.
  "vllm-run": >
    docker run --name ${MODEL_ID} --rm --init
    --label model-deploy.engine=${MODEL_ID}
    --network model-deploy
    --gpus all --ipc host
    -e HUGGING_FACE_HUB_TOKEN
    -v ${env.HOST_CACHE_DIR}/huggingface:/root/.cache/huggingface
    -v ${env.HOST_CACHE_DIR}/vllm:/root/.cache/vllm
    -v ${env.ENGINES_DIR}/vllm:/engines/vllm:ro
    vllm/vllm-openai:v0.31.0
    --host 0.0.0.0 --port 8000
    --gpu-memory-utilization ${vllm-gpu}

  # Shared `docker run` for every llama.cpp engine, on the same terms as
  # vllm-run. `-hf` downloads into the Hugging Face hub layout under
  # $HOME/.cache/huggingface/hub (the image runs as root), so the vLLM HF
  # cache mount persists it too. llama-server reads its token from HF_TOKEN,
  # which compose sets from HUGGING_FACE_HUB_TOKEN. Host and port are explicit:
  # outside the image's LLAMA_ARG_* env the binary defaults to 127.0.0.1:9931.
  # -ngl 99 puts every layer on the GPU.
  "llamacpp-run": >
    docker run --name ${MODEL_ID} --rm --init
    --label model-deploy.engine=${MODEL_ID}
    --network model-deploy
    --gpus all
    -e HF_TOKEN
    -v ${env.HOST_CACHE_DIR}/huggingface:/root/.cache/huggingface
    ghcr.io/ggml-org/llama.cpp:server-cuda-b11749
    --host 0.0.0.0 --port 8080
    -ngl 99

# Every model but yolo26x unloads after 600s with no requests, giving the GPU back.
models:
  "qwen3.5-0.8b":
    proxy: http://${MODEL_ID}:8000
    ttl: 600
    # Shares the GPU with yolo26x (see routing), so it takes less than the
    # default: the pair must still leave the 2.4 GB a single model at 0.85
    # leaves today. 0.70 is an estimate, not a measurement, and the original
    # arithmetic was stale: it assumed yolo26x ≈ 1.5 GB. Measured 2026-11-26,
    # yolo26x holds 3364 MiB (≈ 3.3 GB), so 0.70 × 16380 MiB (11466) plus
    # yolo leaves ≈ 1550 MiB (≈ 1.5 GB), short of the 2.4 GB goal. The value is
    # unchanged. TODO(host check, AC-3): decide 0.70 from `nvidia-smi` free
    # memory on the GPU host with both loaded, in both load orders.
    macros:
      "vllm-gpu": "0.70"
    cmd: |
      ${vllm-run}
      --model Qwen/Qwen3.5-0.8B
      --max-model-len 4096
      --dtype half
      --limit-mm-per-prompt '{"image": 0}'
      --enable-prefix-caching
    cmdStop: docker stop ${MODEL_ID}

  "gemma-3-4b-it":
    proxy: http://${MODEL_ID}:8000
    ttl: 600
    cmd: |
      ${vllm-run}
      --model google/gemma-3-4b-it
      --enable-auto-tool-choice
      --tool-call-parser pythonic
      --chat-template /engines/vllm/tool_chat_template_gemma3_pythonic.jinja
    cmdStop: docker stop ${MODEL_ID}

  # The same model as qwen3.5-0.8b, through llama.cpp. Q8_0 is the closest
  # quant to vLLM's fp16 for a model this small. Text only, like the vLLM
  # entry: the repo ships no mmproj, and --no-mmproj keeps it that way.
  # --jinja uses the chat template embedded in the GGUF.
  "qwen3.5-0.8b-gguf":
    proxy: http://${MODEL_ID}:8080
    ttl: 600
    cmd: |
      ${llamacpp-run}
      -hf ggml-org/Qwen3.5-0.8B-GGUF:Q8_0
      -c 4096
      --no-mmproj
      --jinja
    cmdStop: docker stop ${MODEL_ID}

  # Qwen3.8-27B GSQ-RCO, IQ3_S, through llama.cpp, with the MTP head for
  # speculative decoding. Decode is memory-bandwidth bound: every token streams
  # all the weights, so the head drafts a few tokens that one weight pass then
  # verifies. The -mtp file is about 0.35 GB larger than the plain
  # Qwen3.8-27B-GSQ-RCO-IQ3_S.gguf (11,771,546,784 bytes, ≈ 11.2 GiB), so the
  # first load downloads ≈ 12 GB. `-hf` takes no :quant tag here: --hf-file
  # names the file. The pinned image (b11749) is well past the draft-mtp merge
  # (llama.cpp PR #22673). Reported gains are +33% to +145% on a single stream
  # (RTX 3090: 31 -> 41 tok/s); none is measured on this GPU yet.
  #   --spec-type draft-mtp --spec-draft-n-max 2: 2 is usually best on 24 GB
  #     cards; sweep 2-4 on the GPU host. Short outputs (≤ 400 tokens) gain less.
  #   --parallel 1: speculation helps one stream only; the gain is gone by 4.
  #   -fa on: flash attention, pinned so it never depends on the build default.
  # It is in no routing set, so it runs alone and evicts everything, yolo26x
  # included: 11.2 GiB of weights leave ≈ 1.7 GiB beside yolo, too little for
  # KV cache and buffers. The MTP draft adds ≈ 1-2 GB, so -c is not free: the
  # KV cache is reserved at load time. TODO(host check): if the load runs out
  # of memory on the 16 GiB card, lower -c to 8192.
  # Text only, like qwen3.5-0.8b-gguf (--no-mmproj also saves ≈ 0.9 GB).
  "qwen3.8-27b-gsq-iq3s-gguf":
    proxy: http://${MODEL_ID}:8080
    ttl: 600
    cmd: |
      ${llamacpp-run}
      -hf ISTA-DASLab/Qwen3.8-27B-GSQ-RCO-GGUF
      --hf-file Qwen3.8-27B-GSQ-RCO-IQ3_S-mtp.gguf
      -c 16384
      --no-mmproj
      --jinja
      -fa on
      --parallel 1
      --spec-type draft-mtp
      --spec-draft-n-max 2
    cmdStop: docker stop ${MODEL_ID}

  # Gemma 4 26B-A4B, Google's QAT Q4_0 GGUF, through llama.cpp. A MoE with
  # ≈ 4B active parameters, so decode streams far fewer weights per token than
  # the dense qwen3.8-27b entry: reported ≈ 3.2x faster on an RTX 4090. No MTP:
  # Google's repo ships no MTP file. The repo holds one main GGUF (14.4 GB) and
  # an mmproj file, so `-hf ...:Q4_0` alone picks the right one and the first
  # load downloads ≈ 14.4 GB. Decode settings follow the Qwen entry (-fa on,
  # --parallel 1, --jinja). Sampling and thinking are left to clients.
  # It is in no routing set, so it runs alone and evicts everything, yolo26x
  # included. -c is 32768 because opencode's fixed prompt (system prompt plus
  # tool schemas) is ≈ 10.1k tokens: -c 8192 failed its first request with
  # "request (10147 tokens) exceeds the available context size". Measured at
  # -c 8192: 14580 MiB of 16380 MiB used, ≈ 1.8 GiB free. The weights are
  # ≈ 13.7 GiB, so the KV cache at 8k is only a few hundred MiB (most layers
  # likely use sliding-window attention). -ctk/-ctv q8_0 halve the KV cache
  # (a quantized V cache needs -fa on); the weights stay Q4_0. Estimated
  # worst case at 32k is ≈ 15.2 GiB, an estimate not a measurement.
  # TODO(host check): watch `nvidia-smi` after the first request, not only at
  # load. If the load runs out of memory, lower -c to 24576, then add
  # --n-cpu-moe 2 (moves expert layers to the CPU, ≈ 0.5 GB of VRAM each).
  # Text only (--no-mmproj): the mmproj file is never loaded.
  "gemma-4-26b-a4b-qat-gguf":
    proxy: http://${MODEL_ID}:8080
    ttl: 600
    cmd: |
      ${llamacpp-run}
      -hf google/gemma-4-26B-A4B-it-qat-q4_0-gguf:Q4_0
      -c 32768
      -ctk q8_0
      -ctv q8_0
      --no-mmproj
      --jinja
      -fa on
      --parallel 1
    cmdStop: docker stop ${MODEL_ID}

  # Object detection, reached through /upstream/yolo26x/v1/detect, not chat.
  # The image is pinned to an immutable tag, written only here: `make up`
  # reads it from this file and pulls it before llama-swap starts. No device
  # env, the engine's own default is cuda:0. `unlisted` keeps it out of
  # /v1/models, which OpenAI clients read as the chat menu.
  "yolo26x":
    proxy: http://${MODEL_ID}:8000
    # Never unloaded for idleness, so it is warm between schedule windows.
    # ≈ 3.3 GB (3364 MiB measured on the GPU host, 2026-11-26) fits next to
    # qwen; a gemma or qwen3.8-27b request still evicts it (routing).
    ttl: 0
    unlisted: true
    cmd: >
      docker run --name ${MODEL_ID} --rm --init
      --label model-deploy.engine=${MODEL_ID}
      --network model-deploy
      --gpus all
      ghcr.io/rst0070/model-deploy-yolo:0.2.0
    cmdStop: docker stop ${MODEL_ID}

# Which engines may share the GPU. Requesting a model evicts down to a set
# that contains it. gemma-3-4b-it is in no set, so it only runs alone: at 0.85
# of VRAM it leaves no room for a second engine. So is
# qwen3.8-27b-gsq-iq3s-gguf: its weights alone take ≈ 11.2 GiB. So is
# gemma-4-26b-a4b-qat-gguf: its weights take ≈ 14.4 GB.
routing:
  router:
    use: matrix
    settings:
      matrix:
        vars: { q: qwen3.5-0.8b, qg: qwen3.5-0.8b-gguf, y: yolo26x }
        sets:
          qwen-vision: "(q | qg) & y"

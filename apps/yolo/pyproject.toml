[project]
name = "model-deploy-yolo"
version = "0.1.0"
description = "YOLO object-detection engine served behind llama-swap"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "python-multipart",
    "pillow",
    "ultralytics==8.4.183",
]

# Pick exactly one torch build: `cpu` for tests, `cu126` for the image. Same versions in both.
[project.optional-dependencies]
cpu = ["torch==2.14.1", "torchvision==0.29.1"]
cu126 = ["torch==2.14.1", "torchvision==0.29.1"]

[dependency-groups]
dev = ["pytest", "httpx", "ruff"]

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "cu126" }]]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu", marker = "sys_platform == 'linux'" },
    { index = "pytorch-cu126", extra = "cu126" },
]
torchvision = [
    { index = "pytorch-cpu", extra = "cpu", marker = "sys_platform == 'linux'" },
    { index = "pytorch-cu126", extra = "cu126" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
